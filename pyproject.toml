[project]
name = "king-tutte-datamap-scrolls"
version = "0.1.0"
description = "Environment for running King Tutte pipelines (Seshette) locally."
# 3.12: supported by every pipeline library (numba, torch, toponymy, ...).
requires-python = "==3.12.*"
# Direct dependencies are pinned exactly; uv.lock pins everything else.
# Setup and licenses: docs/setup.md.
dependencies = [
    "datamapplot==0.7.3",
    "duckdb==2.0.0",
    "fast-hdbscan==0.3.2",
    "pyarrow==26.0.0",
    "pyiceberg[pyarrow,sql-sqlite]==0.12.0",
    # 5.x, not 6.x: toponymy 0.5.4 caps transformers below 5, and
    # sentence-transformers 6 needs transformers 5.
    "sentence-transformers==5.7.0",
    "toponymy==0.5.4",
    "umap-learn==0.5.12",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
